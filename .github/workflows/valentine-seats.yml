name: Valentine dance seats

# 2027/2/14 ダンスイベントの席数監視。Stripe の売れ行きを数え、定員で決済リンクを止める。
# 席数が変わったら seats.json をコミットし、サイトを再デプロイして LP の「残り◯席」を更新する。
# イベントが終わったらこのファイルを消す。
#
# GitHub の schedule（cron）は混雑時に数時間おきにしか動かないため、
# 1回の実行の中で5分おきに約5時間半チェックを繰り返し、最後に次の実行を自分で起動する。
# cron は、何かの理由でこの連鎖が切れたときに再開させるための予備。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 同時に動くのは1本だけ。実行中に起動された分は待機し、待機は最新の1本だけ残る。
concurrency:
  group: valentine-seats
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count seats every 5 minutes
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 5分 × 64回 ≒ 5時間20分（ジョブの上限 6時間に収める）
          for i in $(seq 1 64); do
            git pull --quiet --rebase origin main || true
            if node scripts/valentine-seats.mjs; then
              if ! git diff --quiet -- app/events/valentine-dance-2027/seats.json; then
                git add app/events/valentine-dance-2027/seats.json
                git commit -m "Update valentine dance seats"
                if git push origin HEAD:main; then
                  # GITHUB_TOKEN での push は他のワークフローを起動しないので、デプロイは明示的に呼ぶ
                  gh workflow run deploy-pages.yml --ref main
                else
                  echo "push に失敗しました。次の回でやり直します。"
                  git reset --hard origin/main
                fi
              fi
            else
              echo "席数の確認に失敗しました（${i}回目）。次の回でやり直します。"
            fi
            if [ "$i" -lt 64 ]; then sleep 300; fi
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run valentine-seats.yml --ref main
